[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
    etl: mark a test as related to ETL functionality
    llm: mark a test as related to LLM functionality
    api: mark a test as related to API functionality
